<script type="text/babel">
const { useEffect, useRef, useState, useCallback } = React;

/* ─────────────────────────────────────────────────────────────────────────
   GLOBAL EFFECTS (cursor, particles, scroll progress, reveal)
───────────────────────────────────────────────────────────────────────── */
function useGlobalEffects() {
  useEffect(() => {
    /* cursor */
    const cur = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let rx = 0, ry = 0, mx = 0, my = 0;
    const onMove = e => { mx = e.clientX; my = e.clientY; cur.style.left = mx+'px'; cur.style.top = my+'px'; };
    window.addEventListener('mousemove', onMove);
    const ringLoop = () => {
      rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
      ring.style.left = rx+'px'; ring.style.top = ry+'px';
      requestAnimationFrame(ringLoop);
    };
    ringLoop();
    const grow = () => { cur.style.width='20px'; cur.style.height='20px'; ring.style.width='52px'; ring.style.height='52px'; ring.style.opacity='0.4'; };
    const shrink = () => { cur.style.width='12px'; cur.style.height='12px'; ring.style.width='36px'; ring.style.height='36px'; ring.style.opacity='1'; };
    document.querySelectorAll('a,button,[data-hover]').forEach(el => { el.addEventListener('mouseenter', grow); el.addEventListener('mouseleave', shrink); });

    /* scroll progress */
    const bar = document.getElementById('progress-bar');
    const onScroll = () => {
      const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
      bar.style.width = pct + '%';
    };
    window.addEventListener('scroll', onScroll);

    /* reveal on scroll */
    const revealObs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); } });
    }, { threshold: 0.08 });
    const applyReveal = () => document.querySelectorAll('.reveal:not(.visible)').forEach(el => revealObs.observe(el));
    applyReveal();
    const mutObs = new MutationObserver(applyReveal);
    mutObs.observe(document.getElementById('root'), { childList: true, subtree: true });

    /* particles */
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, pts = [];
    const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);
    for (let i = 0; i < 55; i++) pts.push({
      x: Math.random()*1920, y: Math.random()*1080,
      vx: (Math.random()-.5)*0.3, vy: (Math.random()-.5)*0.3,
      r: Math.random()*1.5+0.5,
      a: Math.random()*0.4+0.1,
      c: Math.random() > 0.5 ? '201,103,232' : '250,147,250'
    });
    const drawParticles = () => {
      ctx.clearRect(0,0,W,H);
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${p.c},${p.a})`;
        ctx.fill();
      });
      requestAnimationFrame(drawParticles);
    };
    drawParticles();

    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', resize); };
  }, []);
}

/* ─────────────────────────────────────────────────────────────────────────
   TYPEWRITER HOOK
───────────────────────────────────────────────────────────────────────── */
function useTypewriter(words, speed = 80, pause = 1800) {
  const [display, setDisplay] = useState('');
  const [wi, setWi] = useState(0);
  const [deleting, setDeleting] = useState(false);
  useEffect(() => {
    const word = words[wi];
    const timeout = setTimeout(() => {
      if (!deleting) {
        setDisplay(word.slice(0, display.length + 1));
        if (display.length + 1 === word.length) setTimeout(() => setDeleting(true), pause);
      } else {
        setDisplay(word.slice(0, display.length - 1));
        if (display.length - 1 === 0) { setDeleting(false); setWi((wi + 1) % words.length); }
      }
    }, deleting ? speed / 2 : speed);
    return () => clearTimeout(timeout);
  }, [display, deleting, wi, words, speed, pause]);
  return display;
}

/* ─────────────────────────────────────────────────────────────────────────
   COUNTER HOOK
───────────────────────────────────────────────────────────────────────── */
function useCounter(target, duration = 1800, started = false) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!started) return;
    let start = null;
    const step = ts => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      setVal(Math.floor(p * target));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [started, target, duration]);
  return val;
}

          Hire Me

      {/* mobile menu */}
      {menuOpen && (

            <a key={label} href={href} onClick={()=>setMenuOpen(false)} style={{color:'rgba(255,255,255,0.80)',fontSize:16,fontWeight:500,textDecoration:'none'}}>{label}</a>

/* ─────────────────────────────────────────────────────────────────────────
   STATS ROW
───────────────────────────────────────────────────────────────────────── */
function StatItem({ target, suffix='', label }) {
  const ref = useRef(null);
  const [started, setStarted] = useState(false);
  const val = useCounter(target, 1600, started);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setStarted(true); obs.disconnect(); } }, { threshold: 0.5 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} style={{textAlign:'center',padding:'0 24px'}}>
      <div className="stat-num">{val}{suffix}</div>
      <div style={{fontSize:13,color:'rgba(255,255,255,0.45)',marginTop:6,letterSpacing:'0.05em'}}>{label}</div>
    </div>
  );
}

function SkillBar({ name, pct }) {
  const ref = useRef(null);
  const [go, setGo] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setGo(true); obs.disconnect(); } }, { threshold: 0.3 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
        <span style={{fontSize:13,color:'rgba(255,255,255,0.80)',fontWeight:500}}>{name}</span>

      </div>
      <div style={{height:5,borderRadius:9999,background:'rgba(255,255,255,0.08)'}}>
        <div className="skill-bar-fill" style={{width: go ? pct+'%' : '0%'}}/>
      </div>
    </div>
  );
}

        onMouseLeave={e=>e.currentTarget.style.color='rgba(255,255,255,0.35)'}>
        Back to top
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </a>
    </footer>
  );
}

───────────────────────────────────────────────────────────────────────── */
function App() {
  useGlobalEffects();
  return (
    <React.Fragment>
      <Navbar/>

      <Projects/>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
