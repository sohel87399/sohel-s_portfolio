<script>
(function(){
  const TOTAL = 3000; // 3 seconds for 0→100
  const pctEl   = document.getElementById('loader-pct');
  const fillEl  = document.getElementById('loader-bar-fill');
  const nameEl  = document.getElementById('loader-name');
  const picWrap = document.getElementById('loader-pic-wrap');
  const loader  = document.getElementById('loader');

  // show name immediately
  requestAnimationFrame(()=>requestAnimationFrame(()=>nameEl.classList.add('show')));

  let start = null;
  function tick(ts){
    if(!start) start = ts;
    const elapsed = ts - start;
    const progress = Math.min(elapsed / TOTAL, 1);
    const pct = Math.floor(progress * 100);
    pctEl.textContent = pct;
    fillEl.style.width = pct + '%';

    // show photo at 40%
    if(pct >= 40) picWrap.classList.add('show');

    if(progress < 1){
      requestAnimationFrame(tick);
    } else {
      pctEl.textContent = '100';
      fillEl.style.width = '100%';
      // wait 300ms then fade out loader
      setTimeout(()=>{ loader.classList.add('hide'); }, 300);
    }
  }
  requestAnimationFrame(tick);
})();
</script>

<script type="text/babel">
const { useEffect, useRef, useState, useCallback } = React;

/* ─────────────────────────────────────────────────────────────────────────
   GLOBAL EFFECTS (cursor, particles, scroll progress, reveal)
───────────────────────────────────────────────────────────────────────── */
function useGlobalEffects() {
  useEffect(() => {
    /* cursor */
    const cur = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let rx = 0, ry = 0, mx = 0, my = 0;
    const onMove = e => { mx = e.clientX; my = e.clientY; cur.style.left = mx+'px'; cur.style.top = my+'px'; };
    window.addEventListener('mousemove', onMove);
    const ringLoop = () => {
      rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
      ring.style.left = rx+'px'; ring.style.top = ry+'px';
      requestAnimationFrame(ringLoop);
    };
    ringLoop();
    const grow = () => { cur.style.width='20px'; cur.style.height='20px'; ring.style.width='52px'; ring.style.height='52px'; ring.style.opacity='0.4'; };
    const shrink = () => { cur.style.width='12px'; cur.style.height='12px'; ring.style.width='36px'; ring.style.height='36px'; ring.style.opacity='1'; };
    document.querySelectorAll('a,button,[data-hover]').forEach(el => { el.addEventListener('mouseenter', grow); el.addEventListener('mouseleave', shrink); });

    /* scroll progress */
    const bar = document.getElementById('progress-bar');
    const onScroll = () => {
      const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
      bar.style.width = pct + '%';
    };
    window.addEventListener('scroll', onScroll);

    /* reveal on scroll */
    const revealObs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); } });
    }, { threshold: 0.08 });
    const applyReveal = () => document.querySelectorAll('.reveal:not(.visible)').forEach(el => revealObs.observe(el));
    applyReveal();
    const mutObs = new MutationObserver(applyReveal);
    mutObs.observe(document.getElementById('root'), { childList: true, subtree: true });

    /* particles */
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, pts = [];
    const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);
    for (let i = 0; i < 55; i++) pts.push({
      x: Math.random()*1920, y: Math.random()*1080,
      vx: (Math.random()-.5)*0.3, vy: (Math.random()-.5)*0.3,
      r: Math.random()*1.5+0.5,
      a: Math.random()*0.4+0.1,
      c: Math.random() > 0.5 ? '201,103,232' : '250,147,250'
    });
    const drawParticles = () => {
      ctx.clearRect(0,0,W,H);
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${p.c},${p.a})`;
        ctx.fill();
      });
      requestAnimationFrame(drawParticles);
    };
    drawParticles();

    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', resize); };
  }, []);
}

/* ─────────────────────────────────────────────────────────────────────────
   TYPEWRITER HOOK
───────────────────────────────────────────────────────────────────────── */
function useTypewriter(words, speed = 80, pause = 1800) {
  const [display, setDisplay] = useState('');
  const [wi, setWi] = useState(0);
  const [deleting, setDeleting] = useState(false);
  useEffect(() => {
    const word = words[wi];
    const timeout = setTimeout(() => {
      if (!deleting) {
        setDisplay(word.slice(0, display.length + 1));
        if (display.length + 1 === word.length) setTimeout(() => setDeleting(true), pause);
      } else {
        setDisplay(word.slice(0, display.length - 1));
        if (display.length - 1 === 0) { setDeleting(false); setWi((wi + 1) % words.length); }
      }
    }, deleting ? speed / 2 : speed);
    return () => clearTimeout(timeout);
  }, [display, deleting, wi, words, speed, pause]);
  return display;
}

/* ─────────────────────────────────────────────────────────────────────────
   COUNTER HOOK
───────────────────────────────────────────────────────────────────────── */
function useCounter(target, duration = 1800, started = false) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!started) return;
    let start = null;
    const step = ts => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      setVal(Math.floor(p * target));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [started, target, duration]);
  return val;
}

}

/* ─────────────────────────────────────────────────────────────────────────
   STATS ROW
───────────────────────────────────────────────────────────────────────── */
function StatItem({ target, suffix='', label }) {
  const ref = useRef(null);
  const [started, setStarted] = useState(false);
  const val = useCounter(target, 1600, started);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setStarted(true); obs.disconnect(); } }, { threshold: 0.5 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} style={{textAlign:'center',padding:'0 24px'}}>
      <div className="stat-num">{val}{suffix}</div>
      <div style={{fontSize:13,color:'rgba(255,255,255,0.45)',marginTop:6,letterSpacing:'0.05em'}}>{label}</div>
    </div>
  );
}

function EduCard({e, i}) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  const [hov, setHov] = useState(false);
  useEffect(()=>{
    const obs = new IntersectionObserver(([en])=>{if(en.isIntersecting){setVis(true);obs.disconnect();}},{threshold:0.15});
    if(ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  },[]);
  return (
    <div ref={ref}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        position:'relative',overflow:'hidden',
        borderRadius:20,
        padding:'32px clamp(24px,4vw,48px)',
        background: hov ? 'rgba(201,103,232,0.10)' : 'rgba(255,255,255,0.04)',
        border:`1px solid ${hov?'rgba(201,103,232,0.45)':'rgba(255,255,255,0.08)'}`,
        backdropFilter:'blur(14px)',
        display:'flex',alignItems:'center',gap:28,flexWrap:'wrap',
        opacity: vis?1:0,
        transform: vis ? 'translateX(0)' : `translateX(${i%2===0?'-40px':'40px'})`,
        transition:`opacity 0.7s ease ${i*0.15}s, transform 0.7s ease ${i*0.15}s, border-color 0.3s, background 0.3s`,
        boxShadow: hov ? '0 16px 48px rgba(152,58,214,0.18)' : 'none',
      }}
    >
      {/* big icon */}
      <div style={{fontSize:'clamp(36px,5vw,52px)',flexShrink:0,filter:'drop-shadow(0 0 12px rgba(201,103,232,0.5))'}}>{e.icon}</div>

      {/* text */}
      <div style={{flex:1,minWidth:180}}>
        <p style={{fontSize:'clamp(17px,2.2vw,22px)',color:'#fff',fontWeight:800,lineHeight:1.25,marginBottom:6}}>{e.deg}</p>
        <p style={{fontSize:'clamp(13px,1.5vw,16px)',color:'rgba(255,255,255,0.45)',marginBottom:8}}>{e.inst}</p>
        <span style={{fontSize:13,color:'rgba(255,255,255,0.28)',letterSpacing:'0.05em'}}>{e.period}</span>
      </div>

      {/* big score badge */}
      <div style={{
        flexShrink:0,
        padding:'14px 24px',
        borderRadius:14,
        background:'linear-gradient(135deg,rgba(201,103,232,0.18),rgba(152,58,214,0.10))',
        border:'1px solid rgba(201,103,232,0.35)',
        textAlign:'center',
      }}>
        <p style={{
          fontFamily:'Rubik,sans-serif',fontWeight:900,
          fontSize:'clamp(22px,3.5vw,36px)',
          background:'linear-gradient(135deg,#fff,#FA93FA)',
          WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text',
          lineHeight:1,marginBottom:4,
        }}>{e.score}</p>
        <p style={{fontSize:11,color:'rgba(255,255,255,0.35)',textTransform:'uppercase',letterSpacing:'0.1em'}}>Score</p>
      </div>

      {/* animated left border line */}
      <div style={{
        position:'absolute',left:0,top:0,bottom:0,width:3,
        background:'linear-gradient(to bottom,#FA93FA,#983AD6)',
        transform: hov?'scaleY(1)':'scaleY(0)',
        transformOrigin:'top',
        transition:'transform 0.35s ease',
        borderRadius:'0 2px 2px 0',
      }}/>
    </div>
  );
}
